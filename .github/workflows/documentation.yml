name: documentation

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12' 
      - name: Install dependencies
        run: |
          pip install pytest sphinx sphinx_rtd_theme myst_parser numpydoc pydata_sphinx_theme furo
      - name: Install the package
        run: pip install .
      - name: Run API docstring examples and constraint regressions
        run: |
          pytest --doctest-modules src/macroframe_forecast/MFF.py src/macroframe_forecast/MFF_mixed_frequency.py src/macroframe_forecast/utils.py src/macroframe_forecast/examples.py tests/test_api_docs.py
      - name: Sphinx build
        run: |
          sphinx-build -W --keep-going docs/source docs_ready
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs_ready/
          force_orphan: true
